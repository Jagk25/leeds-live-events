<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paradise Glitch Radar</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">PARADISE GLITCH RADAR</p>
        <h1>Leeds Live Events</h1>
        <p id="status">Loading public listings…</p>
      </div>
      <button id="refresh" type="button">Refresh now</button>
    </header>

    <nav class="views" aria-label="Views">
      <button type="button" data-view="board" class="active">Board</button>
      <button type="button" data-view="calendar">Calendar</button>
      <button type="button" data-view="radar">Clash radar</button>
    </nav>

    <section class="filters">
      <input id="q" placeholder="Search social, tech, sober, venue…" />
      <select id="source">
        <option value="">All sources</option>
        <option value="meetup">Meetup</option>
        <option value="eventbrite">Eventbrite</option>
        <option value="fatsoma">Fatsoma</option>
        <option value="visit-leeds">Visit Leeds</option>
        <option value="skiddle">Skiddle</option>
        <option value="leeds-uni">Leeds Uni</option>
      </select>
      <select id="category">
        <option value="">All categories</option>
        <option value="social">Social / mixer</option>
        <option value="tech">Tech</option>
        <option value="music">Music / club</option>
        <option value="games">Games / nerd</option>
        <option value="outdoors">Outdoors</option>
        <option value="dating">Dating</option>
        <option value="arts">Arts</option>
      </select>
      <select id="when">
        <option value="">Any date</option>
        <option value="week">This week</option>
        <option value="weekend">This weekend</option>
        <option value="september">September 2026</option>
      </select>
      <label class="check"><input id="evening" type="checkbox" checked /> Mixer hours (6pm–late)</label>
      <label class="check"><input id="thuSat" type="checkbox" /> Thu–Sat only</label>
      <label class="check"><input id="rivals" type="checkbox" /> Competitors only</label>
    </section>

    <section id="errors"></section>
    <section id="legend" class="legend"></section>
    <section id="board" class="grid"></section>
    <section id="calendar" class="calendar hidden"></section>
    <section id="radar" class="radar hidden"></section>
  </main>

  <template id="card">
    <article>
      <p class="tag"></p>
      <h2></h2>
      <p class="when"></p>
      <p class="venue"></p>
      <p class="desc"></p>
      <a target="_blank" rel="noopener">View event ↗</a>
    </article>
  </template>
  <script src="/app.js"></script>
</body>
</html>
