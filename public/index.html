<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Signal // Paradise Glitch Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Share+Tech+Mono&family=Syne:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <p class="eyebrow">PARADISE GLITCH</p>
        <p id="status">Reading the room…</p>
      </div>
      <nav class="views">
        <button type="button" data-view="board" class="active">Board</button>
        <button type="button" data-view="calendar">Cal</button>
        <button type="button" data-view="radar">Clash</button>
        <button type="button" data-view="analytics">Stats</button>
      </nav>
      <div class="actions">
        <button id="shareBtn" type="button" class="ghost">Share widget</button>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </div>
  </div>

  <main>
    <section class="board-frame">
      <div class="board-head"><span class="dot"></span> DEPARTURES · LEEDS SOCIAL LINE</div>
      <div id="ticker" class="ticker"><div class="ticker-track">Loading the board…</div></div>
    </section>

    <section id="watch" class="watch"></section>

    <details class="panel filters" open id="filtersPanel">
      <summary>Filter the room <span class="chev">▾</span></summary>
      <div class="filters-row">
        <input id="q" placeholder="Search the room…" />
        <select id="source">
          <option value="">All sources</option>
          <option value="meetup">Meetup</option>
          <option value="eventbrite">Eventbrite</option>
          <option value="fatsoma">Fatsoma</option>
          <option value="visit-leeds">Visit Leeds</option>
          <option value="skiddle">Skiddle</option>
          <option value="leeds-uni">Leeds Uni</option>
        </select>
        <select id="category">
          <option value="">All categories</option>
          <option value="social">Social / mixer</option>
          <option value="tech">Tech</option>
          <option value="music">Music / club</option>
          <option value="games">Games / nerd</option>
          <option value="outdoors">Outdoors</option>
          <option value="dating">Dating</option>
          <option value="arts">Arts</option>
        </select>
        <select id="when">
          <option value="">Any date</option>
          <option value="week">This week</option>
          <option value="weekend">This weekend</option>
          <option value="september">September 2026</option>
        </select>
      </div>
      <div class="filters-row checks">
        <label class="check"><input id="evening" type="checkbox" checked /> Mixer hours</label>
        <label class="check"><input id="thuSat" type="checkbox" /> Thu–Sat</label>
        <label class="check"><input id="rivals" type="checkbox" /> Competitors</label>
        <label class="check"><input id="tagged" type="checkbox" /> Tagged only</label>
      </div>
    </details>

    <section id="errors"></section>
    <p id="legend" class="legend"></p>

    <details class="panel" open>
      <summary>Top groups <span class="chev">▾</span></summary>
      <div id="groups" class="groups-strip"></div>
    </details>

    <section id="board" class="grid"></section>
    <section id="calendar" class="calendar hidden"></section>
    <section id="radar" class="radar hidden"></section>
    <section id="analytics" class="analytics hidden"></section>
  </main>

  <div id="shareModal" class="modal hidden">
    <div class="modal-card">
      <p class="tag">Share widget</p>
      <h3>Embed this radar anywhere</h3>
      <p class="hint">Drop this on paradise-glitch.co.uk, Notion, or a partner site. It auto-refreshes and stays read-only.</p>
      <textarea id="embedCode" readonly rows="3"></textarea>
      <div class="modal-actions">
        <button id="copyEmbed" type="button">Copy embed code</button>
        <a id="openWidget" class="ghost" target="_blank" rel="noopener">Preview widget ↗</a>
        <button id="closeModal" type="button" class="ghost">Close</button>
      </div>
    </div>
  </div>

  <template id="card">
    <article>
      <p class="tag"></p>
      <h2></h2>
      <p class="when"></p>
      <p class="venue"></p>
      <p class="desc"></p>
      <a target="_blank" rel="noopener">Open listing ↗</a>
    </article>
  </template>
  <script src="/app.js"></script>
</body>
</html>
