<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paradise Glitch · Admin Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Share+Tech+Mono&family=Syne:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <button id="sidebarToggle" class="icon-btn" aria-label="Toggle filters">☰</button>
    <div class="brand">
      <strong>Paradise Glitch</strong>
      <span id="status">Reading the room…</span>
    </div>
    <nav class="views">
      <button type="button" data-view="board" class="active">Board</button>
      <button type="button" data-view="calendar">Calendar</button>
      <button type="button" data-view="radar">Clash radar</button>
      <button type="button" data-view="analytics">Analytics</button>
    </nav>
    <div class="actions">
      <button id="shareBtn" type="button" class="ghost">Share widget</button>
      <button id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <div class="layout">
    <div id="sidebarScrim" class="scrim hidden"></div>
    <aside id="sidebar" class="sidebar">
      <section class="sb-block">
        <h4>Filter</h4>
        <input id="q" placeholder="Search the room…" />
        <select id="source">
          <option value="">All sources</option>
          <option value="meetup">Meetup</option>
          <option value="eventbrite">Eventbrite</option>
          <option value="fatsoma">Fatsoma</option>
          <option value="visit-leeds">Visit Leeds</option>
          <option value="skiddle">Skiddle</option>
          <option value="leeds-uni">Leeds Uni</option>
        </select>
        <select id="category">
          <option value="">All categories</option>
          <option value="social">Social / mixer</option>
          <option value="tech">Tech</option>
          <option value="music">Music / club</option>
          <option value="games">Games / nerd</option>
          <option value="outdoors">Outdoors</option>
          <option value="dating">Dating</option>
          <option value="arts">Arts</option>
        </select>
        <select id="when">
          <option value="">Any date</option>
          <option value="week">This week</option>
          <option value="weekend">This weekend</option>
          <option value="september">September 2026</option>
        </select>
        <label class="check"><input id="evening" type="checkbox" checked /> Mixer hours (5pm+)</label>
        <label class="check"><input id="thuSat" type="checkbox" /> Thu–Sat only</label>
        <label class="check"><input id="rivals" type="checkbox" /> Competitors only</label>
        <label class="check"><input id="tagged" type="checkbox" /> Tagged groups only</label>
      </section>

      <section class="sb-block">
        <h4>Top groups · ★ pin · dot to tag</h4>
        <div id="groups" class="groups-list"></div>
      </section>
    </aside>

    <main class="content">
      <div class="board-frame">
        <div class="board-head"><span class="dot"></span> DEPARTURES · LEEDS SOCIAL LINE</div>
        <div id="ticker" class="ticker">
          <button type="button" class="tk-nav tk-prev" aria-label="Previous departure">‹</button>
          <div class="tk-stage"><div class="tk-item">Loading the board…</div></div>
          <button type="button" class="tk-nav tk-next" aria-label="Next departure">›</button>
        </div>
      </div>

      <div id="watch" class="watch"></div>
      <div id="errors"></div>
      <p id="legend" class="legend"></p>

      <section id="board" class="board-list"></section>
      <section id="calendar" class="calendar hidden"></section>
      <section id="radar" class="radar hidden"></section>
      <section id="analytics" class="analytics hidden"></section>
    </main>
  </div>

  <div id="shareModal" class="modal hidden">
    <div class="modal-card">
      <p class="tag">Share widget</p>
      <h3>Embed this radar anywhere</h3>
      <p class="hint">Drop this on paradise-glitch.co.uk, Notion, or a partner site. Read-only, auto-refreshing.</p>
      <textarea id="embedCode" readonly rows="3"></textarea>
      <div class="modal-actions">
        <button id="copyEmbed" type="button">Copy embed code</button>
        <a id="openWidget" class="ghost" target="_blank" rel="noopener">Preview widget ↗</a>
        <button id="closeModal" type="button" class="ghost">Close</button>
      </div>
    </div>
  </div>

  <template id="row">
    <article class="event-row">
      <button type="button" class="card-color-dot" title="Cycle a custom color for this card"></button>
      <div class="col-time"><span class="tag"></span><span class="when"></span></div>
      <div class="col-main">
        <h2></h2>
        <p class="venue"></p>
        <button type="button" class="series-toggle hidden"></button>
        <div class="series-more hidden"></div>
      </div>
      <a class="col-open" target="_blank" rel="noopener">Open ↗</a>
    </article>
  </template>
  <script src="/app.js"></script>
</body>
</html>
